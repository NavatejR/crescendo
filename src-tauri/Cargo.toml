[package]
name = "crescendo"
version = "0.1.0"
description = "A beautiful, deeply customizable local music player"
authors = ["NavatejR"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crescendo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio engine
symphonia = { version = "0.6", features = ["all"] }
rodio = { version = "0.22", features = ["symphonia-all"] }
rustfft = "6.4"
ringbuf = "0.5"

# Library & metadata
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
notify = "8"
walkdir = "2"
dirs = "6"

# Utilities
parking_lot = "0.12"

# Read optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
